<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GG Creation Studio</title>
  <meta name="description" content="Sign in to your GG Creation account to access saved DIY projects, custom bill estimates, and exclusive channel perks.">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Ambient Glowing Background Elements -->
  <div class="bg-ambient-orb orb-red"></div>
  <div class="bg-ambient-orb orb-rose"></div>

  <!-- STEP 2: NAVIGATION BAR -->
  <header class="navbar" id="mainNavbar">
    <div class="container navbar-container">
      <a href="index.html" class="brand-logo" id="navBrandLogo">
        <div class="brand-icon-box">GG</div>
        <div class="brand-text">
          <span class="brand-title">GG Creation</span>
          <span class="brand-tag">HOMEMADE & DIY INNOVATION</span>
        </div>
      </a>

      <nav>
        <ul class="nav-menu" id="navDesktopMenu">
          <li><a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a></li>
          <li><a href="projects.html" class="nav-link"><i class="fa-solid fa-shapes"></i> Project</a></li>
          <li><a href="products.html" class="nav-link"><i class="fa-solid fa-link"></i> Link Product</a></li>
          <li><a href="about.html" class="nav-link"><i class="fa-solid fa-user"></i> About</a></li>
          <li><a href="contact.html" class="nav-link"><i class="fa-solid fa-phone"></i> Contact Number</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <button class="nav-btn" id="themeToggleBtn" aria-label="Toggle Theme">
          <i class="fa-solid fa-sun" id="themeIcon"></i>
        </button>
        <a href="signup.html" class="btn btn-primary btn-sm">
          <i class="fa-solid fa-user-plus"></i> Sign Up
        </a>
      </div>
    </div>
  </header>

  <!-- STEP 1: LOGIN CARD -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="badge badge-spent-time" style="margin-bottom: 8px;">
          <i class="fa-solid fa-key"></i> Step 1 in Notebook Wireframe
        </div>
        <h1 class="auth-title">Creator <span>Login</span></h1>
        <p class="auth-subtitle">Welcome back! Sign in with your Gmail and password.</p>
      </div>

      <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
        <div class="form-group">
          <label class="form-label" for="loginGmail">Gmail Address *</label>
          <input type="email" id="loginGmail" class="form-input" placeholder="gjgokul2005@gmail.com" required value="gjgokul2005@gmail.com">
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password *</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••••••" required value="creator123">
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; font-size: 0.88rem;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-secondary);">
            <input type="checkbox" id="rememberMe" checked> Remember Me
          </label>
          <a href="#" style="color: var(--accent-red);" onclick="showToast('Password reset link sent to your Gmail', 'info')">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In to Account
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Create an Account (Sign Up)</a>
      </div>

      <div style="margin-top: 20px; text-align: center; border-top: 1px solid var(--border-color); padding-top: 16px;">
        <a href="index.html" class="bottom-back-btn" onclick="if (history.length > 1) { history.back(); return false; }">
          <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    function handleLogin() {
      const email = document.getElementById('loginGmail').value;
      const user = {
        name: 'Gokul (GG)',
        email: email,
        avatar: 'assets/images/avatar.jpg'
      };
      localStorage.setItem('gg_user', JSON.stringify(user));
      showToast('Logged in successfully! Redirecting...', 'success');
      setTimeout(() => {
        window.location.href = 'projects.html';
      }, 700);
    }
  </script>
</body>
</html>
